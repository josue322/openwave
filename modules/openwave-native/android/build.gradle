plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.openwavenative'
version = '1.0.0'

android {
  namespace "expo.modules.openwavenative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "proguard-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.media:media:1.7.0'

  def androidxMedia3Version = "1.9.1"
  implementation "androidx.media3:media3-session:$androidxMedia3Version"
  implementation "androidx.media3:media3-exoplayer:$androidxMedia3Version"
  implementation "androidx.media3:media3-common:$androidxMedia3Version"
  implementation "androidx.media3:media3-cast:$androidxMedia3Version"
  implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
}

