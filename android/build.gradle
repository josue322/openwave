// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects { sub ->
  if (sub.name.contains("reanimated") || sub.name.contains("worklets") || sub.name.contains("screens") || sub.name.contains("gesture") || sub.name.contains("sqlite") || sub.name.contains("modules-core")) {
    sub.pluginManager.withPlugin("com.android.library") {
      def androidExt = sub.extensions.findByName("android")
      if (androidExt != null) {
        androidExt.externalNativeBuild.cmake.buildStagingDirectory = new File(rootProject.projectDir.parentFile, ".cxx/" + sub.name.take(8))
        androidExt.defaultConfig.externalNativeBuild.cmake.arguments("-DCMAKE_OBJECT_PATH_MAX=160")
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
